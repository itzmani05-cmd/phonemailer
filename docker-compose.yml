services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-phonemail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-phonemail}
      POSTGRES_DB: ${POSTGRES_DB:-phonemail}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-phonemail}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-phonemail}:${POSTGRES_PASSWORD:-phonemail}@postgres:5432/${POSTGRES_DB:-phonemail}
      INBOUND_SECRET: ${INBOUND_SECRET:-change-me}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      EMAIL_API_KEY: ${EMAIL_API_KEY:?set EMAIL_API_KEY in .env}
      MAIL_DOMAIN: ${MAIL_DOMAIN:-phonemail.com}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID:-}
      TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      ANDROID_SMS_APP_HASH: ${ANDROID_SMS_APP_HASH:-}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  mail-server:
    build: ./mail-server
    environment:
      SMTP_PORT: 2525
      BACKEND_URL: http://backend:3000
      MAIL_DOMAIN: ${MAIL_DOMAIN:-phonemail.com}
      INBOUND_SECRET: ${INBOUND_SECRET:-change-me}
    ports:
      - "${SMTP_HOST_PORT:-2525}:2525"
    depends_on:
      - backend

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
